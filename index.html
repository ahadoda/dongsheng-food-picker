<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f65f4d">
  <title>东升科技园外卖随机选择器</title>
  <style>
    :root{--ink:#25221f;--muted:#746d66;--paper:#fffaf4;--card:#fff;--line:#eadfd3;--accent:#f65f4d;--accent2:#ffba57;--green:#2d8b67;--shadow:0 18px 50px rgba(87,55,31,.12)}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 0,#ffe5c3 0,transparent 28%),radial-gradient(circle at 92% 8%,#ffd8d0 0,transparent 25%),var(--paper);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
    button,input,select{font:inherit}.wrap{width:min(1080px,calc(100% - 28px));margin:auto;padding:34px 0 56px}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:end;margin-bottom:24px}.eyebrow{display:inline-flex;gap:8px;align-items:center;padding:7px 11px;border:1px solid #ffc4ba;border-radius:999px;color:#b63b2e;background:#fff4f1;font-size:13px;font-weight:700}.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.04;letter-spacing:-.05em;margin:15px 0 12px}.hero p{color:var(--muted);font-size:16px;line-height:1.75;margin:0;max-width:650px}.stats{background:#292521;color:#fff;border-radius:24px;padding:24px;box-shadow:var(--shadow)}.stats strong{display:block;font-size:48px;line-height:1}.stats span{color:#d8cec5}.grid{display:grid;grid-template-columns:390px 1fr;gap:22px}.panel{background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid rgba(234,223,211,.9);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.panel h2{font-size:18px;margin:0 0 18px}.field{margin:0 0 18px}.labelrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.labelrow label{font-weight:700}.score{font-size:24px;color:var(--accent);font-weight:900}.hint{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-top:5px}input[type=range]{width:100%;accent-color:var(--accent)}select,input[type=number]{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;color:var(--ink)}.twocol,.threecol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.threecol{grid-template-columns:repeat(3,1fr)}.check{display:flex;align-items:flex-start;gap:9px;color:#4f4944;font-size:14px;line-height:1.45;margin:12px 0}.check input{margin-top:3px;accent-color:var(--accent)}.draw{width:100%;border:0;border-radius:15px;padding:15px 18px;background:linear-gradient(135deg,var(--accent),#ff8261);color:#fff;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 10px 22px rgba(246,95,77,.27);transition:.2s transform}.draw:hover{transform:translateY(-2px)}.result{min-height:510px;display:flex;flex-direction:column}.empty{margin:auto;text-align:center;color:var(--muted)}.empty .bowl{font-size:74px;display:block;filter:drop-shadow(0 10px 12px rgba(80,50,30,.12));margin-bottom:12px}.resultView{display:none}.resultView.show{display:block}.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.badge{padding:6px 9px;border-radius:999px;background:#f5eee7;color:#655d55;font-size:12px;font-weight:700}.badge.local{color:#176c4b;background:#e8f7f0}.choice{font-size:clamp(32px,5vw,54px);line-height:1.08;letter-spacing:-.04em;margin:0}.dish{font-size:22px;color:var(--accent);font-weight:800;margin:8px 0 18px}.reason{background:#fff7ed;border-left:4px solid var(--accent2);padding:14px 16px;border-radius:0 12px 12px 0;line-height:1.65;color:#5f554c}.feeBox{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}.feeBox h3{margin:0 0 5px;font-size:15px}.feeBox p{margin:0 0 12px;color:var(--muted);font-size:12px}.actions{display:flex;gap:10px;margin-top:18px}.secondary{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.recent{margin-top:20px}.recent h3{font-size:14px;margin:0 0 9px;color:var(--muted)}.recentList{display:flex;flex-wrap:wrap;gap:7px}.recentList span{font-size:12px;background:#f5eee7;border-radius:999px;padding:6px 9px}.foot{color:var(--muted);font-size:12px;line-height:1.7;margin-top:20px;text-align:center}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#26221f;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:800px){.hero,.grid{grid-template-columns:1fr}.hero{align-items:start}.stats{padding:18px}.stats strong{font-size:36px}.result{min-height:430px}.panel{padding:18px}.twocol,.threecol{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div><span class="eyebrow">🥡 美团 · 宝盛里观林园</span><h1>今天外卖<br>吃什么？</h1><p>从观林园地址的美团外卖录屏中整理出 193 家门店，根据口味、心情和费用偏好帮你随机决定。</p></div>
      <div class="stats"><strong id="poolCount">193</strong><span>家当前可抽取门店</span></div>
    </section>
    <section class="grid">
      <aside class="panel">
        <h2>设定今天的偏好</h2>
        <div class="field"><div class="labelrow"><label for="taste">口味：辣 → 甜</label><span class="score" id="tasteValue">5</span></div><input id="taste" type="range" min="0" max="10" value="5"><div class="hint"><span>麻辣重口</span><span>咸鲜适中</span><span>偏甜</span></div></div>
        <div class="field"><div class="labelrow"><label for="mood">今天的情绪</label><span class="score" id="moodValue">5</span></div><input id="mood" type="range" min="0" max="10" value="5"><div class="hint"><span>疲惫治愈</span><span>日常随意</span><span>兴奋尝鲜</span></div></div>
        <div class="twocol field"><div><label for="budget">餐品预算</label><select id="budget"><option value="999">不限</option><option value="25">¥25 以内</option><option value="40" selected>¥40 以内</option><option value="60">¥60 以内</option></select></div><div><label for="delivery">配送费上限</label><select id="delivery"><option value="999">不限</option><option value="0">¥0</option><option value="3" selected>¥3</option><option value="5">¥5</option><option value="8">¥8</option></select></div></div>
        <div class="twocol field"><div><label for="packing">包装费上限</label><select id="packing"><option value="999">不限</option><option value="0">¥0</option><option value="2" selected>¥2</option><option value="4">¥4</option><option value="6">¥6</option></select></div><div><label for="category">餐品类型</label><select id="category"><option value="全部">全部</option><option>中式快餐</option><option>面食粉类</option><option>川湘重口</option><option>日韩料理</option><option>西式简餐</option><option>轻食</option><option>甜品饮品</option></select></div></div>
        <label class="check"><input id="localOnly" type="checkbox">只看名称完整的门店</label>
        <label class="check"><input id="mealOnly" type="checkbox">只抽正餐，排除甜品饮品</label>
        <label class="check"><input id="allowUnknown" type="checkbox" checked>允许餐品价、配送费或包装费尚未录入的店铺</label>
        <button class="draw" id="draw">🎲 帮我决定</button>
      </aside>
      <section class="panel result">
        <div class="empty" id="empty"><span class="bowl">🍜</span><strong>选择困难，交给随机</strong><p>调整左侧偏好，然后抽一家</p></div>
        <div class="resultView" id="resultView"><div class="badges" id="badges"></div><h2 class="choice" id="store"></h2><div class="dish" id="dish"></div><div class="reason" id="reason"></div><div class="feeBox"><h3>记录本店费用</h3><p>费用保存在当前浏览器，下次筛选自动生效。请按美团当前页面填写。</p><div class="threecol"><div><label for="feePrice">餐品价（元）</label><input id="feePrice" type="number" min="0" step="0.1" placeholder="待核实"></div><div><label for="feeDelivery">配送费（元）</label><input id="feeDelivery" type="number" min="0" step="0.1" placeholder="待核实"></div><div><label for="feePacking">包装费（元）</label><input id="feePacking" type="number" min="0" step="0.1" placeholder="待核实"></div></div></div><div class="actions"><button class="secondary" id="again">换一家</button><button class="secondary" id="copy">复制推荐</button></div><div class="recent"><h3>最近抽到</h3><div class="recentList" id="recentList"></div></div></div>
      </section>
    </section>
    <p class="foot">候选池来自美团在“宝盛里观林园-12号楼”地址下的录屏快照；不代表实时营业、官方排名或当前一定可配送。餐品价、配送费、包装费与优惠均以美团结算页为准。</p>
  </main>
  <div class="toast" id="toast">已复制</div>
  <script src="stores.js"></script>
  <script>
    const legacyStores=[
      ["谷田稻香（东升科技园店）","中式快餐",5,2,1],["汉堡王（东升科技园店）","西式简餐",6,6,1],["赛百味（东升科技园店）","西式简餐",6,5,1],["吉野家（西小口路店）","日韩料理",7,3,1],["陕味食族油泼面","面食粉类",3,5,1],["小菜园（新辰里店）","中式快餐",5,4,1],["峨嵋酒家（学院路店）","川湘重口",2,6,1],["那家小馆","中式快餐",6,5,1],["喜茶（东升科技园GO店）","甜品饮品",9,7,1],["麦当劳","西式简餐",6,4,0],
      ["肯德基","西式简餐",6,5,0],["必胜客","西式简餐",7,6,0],["达美乐比萨","西式简餐",7,7,0],["华莱士","西式简餐",5,4,0],["塔斯汀中国汉堡","西式简餐",5,6,0],["张亮麻辣烫","川湘重口",2,6,0],["杨国福麻辣烫","川湘重口",2,5,0],["麻辣诱惑","川湘重口",1,7,0],["眉州东坡","中式快餐",4,5,0],["费大厨辣椒炒肉","川湘重口",2,7,0],
      ["小炒黄牛肉","川湘重口",2,6,0],["农耕记","川湘重口",3,6,0],["真功夫","中式快餐",5,3,0],["永和大王","中式快餐",6,2,0],["老乡鸡","中式快餐",5,3,0],["乡村基","中式快餐",4,3,0],["南城香","中式快餐",5,2,0],["和府捞面","面食粉类",5,4,0],["马记永牛肉面","面食粉类",4,4,0],["陈香贵兰州牛肉面","面食粉类",4,4,0],
      ["遇见小面","面食粉类",2,6,0],["阿香米线","面食粉类",3,4,0],["米村拌饭","日韩料理",4,4,0],["权金城","日韩料理",5,6,0],["味千拉面","日韩料理",6,4,0],["吉哆啦回转寿司","日韩料理",7,7,0],["池奈日式咖喱蛋包饭","日韩料理",8,5,0],["萨莉亚","西式简餐",7,4,0],["Wagas","轻食",7,5,0],["gaga鲜语","轻食",7,6,0],
      ["超级碗","轻食",6,5,0],["沙野轻食","轻食",6,4,0],["新元素","轻食",7,5,0],["瑞幸咖啡","甜品饮品",8,4,0],["星巴克","甜品饮品",8,5,0],["奈雪的茶","甜品饮品",9,6,0],["霸王茶姬","甜品饮品",9,5,0],["蜜雪冰城","甜品饮品",10,5,0],["好利来","甜品饮品",9,4,0],["满记甜品","甜品饮品",10,5,0]
    ];
    const stores=window.MEITUAN_STORES||legacyStores.map(row=>({name:row[0],complete:true}));
    const recordedStoreData={
      "久久丫·火锅鲜卤（育新地铁店）":{delivery:.8,distance:"4.4km",eta:"27分钟"},
      "渝拌川重庆凉拌菜（永泰东里店）":{delivery:0,distance:"1.9km",eta:"20分钟"},
      "小院烧烤":{delivery:0,distance:"6.3km",eta:"63分钟"},
      "桥头排骨（安宁庄店）":{delivery:1.6,distance:"4.6km"},
      "夸父炸串（酸辣粉·拌饼·拌饭…）":{delivery:0,distance:"591m",eta:"20分钟"},
      "黄氏许牛奶甜品（安宁庄店）":{delivery:4.7,distance:"4.6km",eta:"27分钟"},
      "德克士（学清路店）":{delivery:5.5,distance:"5.0km",eta:"28分钟"},
      "匠熙小馆（亚运村店）":{delivery:9,distance:"7.6km",eta:"41分钟"},
      "绝味鸭脖（新都店）":{delivery:0,distance:"4.0km",eta:"24分钟"}
    };
    function categoryFor(name){
      if(/奶|甜品|茶饮|咖啡|蛋糕|饮品/.test(name))return"甜品饮品";
      if(/日料|寿司|居酒屋|韩式|韩国|三文鱼/.test(name))return"日韩料理";
      if(/汉堡|炸鸡|鸡排|比萨|披萨|赛百味|必胜客|德克士|肯德基|达美乐/.test(name))return"西式简餐";
      if(/轻食|沙拉/.test(name))return"轻食";
      if(/面|米线|螺蛳粉|凉皮|羊肉粉|水盆羊肉|云饺|饺子|包子|生煎|煎饼|鲜肉饼|串饼/.test(name))return"面食粉类";
      if(/麻辣|冒菜|串|烧烤|烤|鸭脖|火锅|炸串|臭豆腐|蹄花|辣|鸡架|鸡爪|鲜卤|热卤|卤味/.test(name))return"川湘重口";
      return"中式快餐";
    }
    const profiles={"中式快餐":[5,4],"面食粉类":[4,4],"川湘重口":[2,7],"日韩料理":[6,6],"西式简餐":[6,5],"轻食":[7,4],"甜品饮品":[9,5]};
    const candidates=stores.map((store,index)=>{const category=categoryFor(store.name),profile=profiles[category],recorded=recordedStoreData[store.name]||{};return{id:`store-${index}`,store:store.name,complete:store.complete,category,taste:profile[0],mood:profile[1],dish:"建议先看本店招牌",price:null,delivery:recorded.delivery??null,distance:recorded.distance??null,eta:recorded.eta??null}});
    const $=id=>document.getElementById(id), feeData=JSON.parse(localStorage.getItem("dongsheng-fees")||"{}"), recent=[];let current=null;
    function feeFor(item){const saved=feeData[item.store]||{};return{price:saved.price!==undefined?saved.price:item.price,delivery:saved.delivery!==undefined?saved.delivery:item.delivery,packing:saved.packing!==undefined?saved.packing:null}}
    function filters(){return{taste:+$("taste").value,mood:+$("mood").value,budget:+$("budget").value,delivery:+$("delivery").value,packing:+$("packing").value,category:$("category").value,localOnly:$("localOnly").checked,mealOnly:$("mealOnly").checked,allowUnknown:$("allowUnknown").checked}}
    function pool(){const f=filters();return candidates.filter(x=>{const fee=feeFor(x),known=fee.price!==null&&fee.delivery!==null&&fee.packing!==null;return(fee.price===null||fee.price<=f.budget)&&(f.category==="全部"||x.category===f.category)&&(!f.localOnly||x.complete)&&(!f.mealOnly||x.category!=="甜品饮品")&&(f.allowUnknown||known)&&(fee.delivery===null||fee.delivery<=f.delivery)&&(fee.packing===null||fee.packing<=f.packing)})}
    function refresh(){const n=pool().length;$("poolCount").textContent=n;$("draw").disabled=n===0;$("draw").textContent=n?"🎲 帮我决定":"没有符合条件的候选"}
    function choose(){const list=pool();if(!list.length)return;const f=filters(),available=list.filter(x=>!recent.slice(0,5).includes(x.id)),source=available.length?available:list;const scored=source.map(x=>({x,w:Math.max(.15,12-Math.abs(x.taste-f.taste)-Math.abs(x.mood-f.mood)+Math.random()*3)}));let cursor=Math.random()*scored.reduce((a,b)=>a+b.w,0),picked=scored[0].x;for(const row of scored){cursor-=row.w;if(cursor<=0){picked=row.x;break}}current=picked;recent.unshift(picked.id);if(recent.length>8)recent.pop();show(picked)}
    function show(x){$("empty").style.display="none";$("resultView").classList.add("show");$("store").textContent=x.store;$("dish").textContent=x.dish;const fee=feeFor(x),f=filters(),details=[x.distance&&`距离 ${x.distance}`,x.eta&&`预计 ${x.eta}`].filter(Boolean).map(text=>`<span class="badge">${text}</span>`).join("");$("badges").innerHTML=`<span class="badge ${x.complete?'local':''}">${x.complete?'美团·观林园录屏':'美团录屏·店名待补全'}</span><span class="badge">${x.category}</span><span class="badge">餐品价 ${fee.price===null?'待核实':'¥'+fee.price}</span><span class="badge">配送费 ${fee.delivery===null?'待核实':'¥'+fee.delivery}</span>${details}`;$("reason").textContent=`这家店曾出现在“宝盛里观林园-12号楼”的美团外卖录屏中，并与当前口味 ${f.taste}/10、情绪 ${f.mood}/10 比较接近。下单前请重新确认营业状态、配送范围、起送价和最终实付。`;$("feePrice").value=fee.price??"";$("feeDelivery").value=fee.delivery??"";$("feePacking").value=fee.packing??"";$("recentList").innerHTML=recent.map(id=>{const item=candidates.find(c=>c.id===id);return `<span>${item.store}</span>`}).join("")}
    function saveFee(){if(!current)return;const price=$("feePrice").value,delivery=$("feeDelivery").value,packing=$("feePacking").value;feeData[current.store]={price:price===""?null:+price,delivery:delivery===""?null:+delivery,packing:packing===""?null:+packing};localStorage.setItem("dongsheng-fees",JSON.stringify(feeData));show(current);refresh()}
    function toast(message){$("toast").textContent=message;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1400)}
    ["taste","mood"].forEach(id=>$(id).addEventListener("input",()=>{$(id+"Value").textContent=$(id).value;refresh()}));["budget","delivery","packing","category","localOnly","mealOnly","allowUnknown"].forEach(id=>$(id).addEventListener("change",refresh));$("draw").addEventListener("click",choose);$("again").addEventListener("click",choose);["feePrice","feeDelivery","feePacking"].forEach(id=>$(id).addEventListener("change",saveFee));$("copy").addEventListener("click",async()=>{if(!current)return;const fee=feeFor(current),text=`今天吃：${current.store}（餐品价${fee.price===null?'待核实':'约 ¥'+fee.price}，配送费${fee.delivery===null?'待核实':'约 ¥'+fee.delivery}）`;try{await navigator.clipboard.writeText(text);toast("推荐已复制")}catch{toast("复制失败，请手动选择")}});refresh();
  </script>
</body>
</html>
